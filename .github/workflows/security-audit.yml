name: Security Audit & Tests

on:
  workflow_dispatch:

jobs:
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec nx run-many -t test --all

  ruby-tests:
    name: Ruby Tests (RSpec)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: grit42com/pgrdkit:16.3-2024.03.1
        env:
          POSTGRES_USER: grit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/grit/server
    env:
      RAILS_ENV: test
      POSTGRES_USER: grit
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      GRIT_DATABASE: grit
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true
          working-directory: apps/grit/server
          bundler-opts: --with local

      - name: Set up database
        run: bundle exec rails db:create db:schema:load

      - name: Run RSpec
        run: bundle exec rspec

  brakeman:
    name: Brakeman (Ruby SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/grit/server
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9
          bundler-cache: true
          working-directory: apps/grit/server
          bundler-opts: --with local

      - name: Run Brakeman
        # --no-exit-on-warn: exit 0 on warnings, non-zero only on errors.
        # Switch to --exit-on-warn once the initial warning baseline is resolved.
        run: bundle exec brakeman -q --no-exit-on-warn

  bundler-audit:
    name: Bundler Audit (Gem CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.9

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Audit main app
        working-directory: apps/grit/server
        run: bundle-audit check --update

      - name: Audit core module
        working-directory: modules/core/backend
        run: bundle-audit check --update

      - name: Audit compounds module
        working-directory: modules/compounds/backend
        run: bundle-audit check --update

      - name: Audit assays module
        working-directory: modules/assays/backend
        run: bundle-audit check --update

  pnpm-audit:
    name: pnpm Audit (npm CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit
        # moderate: flags medium+ severity. Raise to --audit-level high to reduce noise if needed.
        run: pnpm audit --audit-level moderate

  codeql:
    name: CodeQL (SAST — Ruby & TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ruby, javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
